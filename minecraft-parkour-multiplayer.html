<!DOCTYPE html>
<html>
<head>
    <title>Minecraft Parkour Multiplayer</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #game { width: 800px; height: 600px; margin: auto; border: 1px solid #000; }
        #start-button { display: block; margin: 20px auto; }
    </style>
</head>
<body>
    <h1>Minecraft Parkour Multiplayer Game</h1>
    <div id="game"></div>
    <button id="start-button">Start Game</button>
    <script>
        // Simulate multiplayer game logic
        const players = [];
        let gameStarted = false;

        document.getElementById('start-button').addEventListener('click', () => {
            if (!gameStarted) {
                startGame();
            }
        });

        function startGame() {
            gameStarted = true;
            alert('Game started! Players can join now.');
            // Initialize players
            for (let i = 1; i <= 4; i++) {
                players.push('Player ' + i);
            }
            alert('Players in the game: ' + players.join(', '));
            // Additional game logic here
        }
    </script>
</body>
</html>
